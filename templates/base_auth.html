<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block judul %}Akun{% endblock %} · Curug Cipeteuy</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EF;--surf:#fff;--ink:#16261F;--mut:#5B6B63;--pri:#1E5C45;--pri-ink:#fff;--acc:#2A7FA3;--line:#CFDAD3;--warn:#B3441F;--ok:#1E7A4A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A15;--surf:#17261F;--ink:#E6EFE9;--mut:#9DB0A5;--pri:#4DB88A;--pri-ink:#0B1712;--acc:#6CB8D8;--line:#2B3F35;--warn:#F08A63;--ok:#5AD08F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
header{background:var(--pri);color:var(--pri-ink);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header a{color:inherit;text-decoration:none}
header h1{margin:0;font-size:1.15rem;font-weight:800}
main{max-width:430px;margin:0 auto;padding:28px 14px 60px}
main.lebar{max-width:860px}
h2{font-size:1.9rem;line-height:1.1;margin:8px 0 6px;font-weight:800}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
label{display:block;font-size:.9rem;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.pw{position:relative}.pw input{padding-right:78px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--pri);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:6px 8px}
.btn{display:inline-block;background:var(--pri);color:var(--pri-ink);border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.blok{width:100%;margin-top:18px}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
a{color:var(--acc)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.msg{padding:10px 12px;border-radius:8px;margin:12px 0 0;border:1px solid currentColor;font-weight:600}
.msg.error{color:var(--warn)}.msg.ok{color:var(--ok)}
.alt-link{text-align:center;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid currentColor}
.ok{color:var(--ok)}.bad{color:var(--warn)}.wait{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('index') }}">Curug Cipeteuy · Tiket Online</a></h1>
  {% if user %}<a href="{{ url_for('akun') }}">{{ user.nama }}</a>{% else %}<a href="{{ url_for('index') }}">Beranda</a>{% endif %}
</header>
<main class="{% block kelas %}{% endblock %}">
  {% for kat, isi in get_flashed_messages(with_categories=true) %}
    <div class="msg {{ kat }}" role="alert">{{ isi }}</div>
  {% endfor %}
  {% block isi %}{% endblock %}
</main>
<script>
document.querySelectorAll('.pw button').forEach(function(b){
  b.addEventListener('click',function(){
    var i=b.parentNode.querySelector('input'),t=i.type==='password';
    i.type=t?'text':'password';b.textContent=t?'Sembunyikan':'Lihat';
  });
});
</script>
</body>
</html>
